<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>合译 · 跳转线上站点</title>
    <meta name="description" content="合译 · 工坊的完整线上站点正在新地址上线，请稍候。" />
    <meta http-equiv="refresh" content="1.5; url=https://co-translate.vercel.app" />
    <style>
      :root {
        --bg: #0b1020;
        --panel: #151b2e;
        --line: #26304a;
        --text: #e8ecf6;
        --muted: #93a0bd;
        --accent: #5b8cff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(900px 500px at 20% 0%, rgba(91, 140, 255, 0.18), transparent 60%),
          radial-gradient(700px 500px at 100% 100%, rgba(122, 92, 255, 0.14), transparent 60%),
          var(--bg);
        color: var(--text);
        font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, -apple-system, sans-serif;
        line-height: 1.6;
      }
      main {
        width: min(560px, calc(100% - 40px));
        margin: 40px auto;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 34px 34px 30px;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
      }
      h1 { margin: 0 0 10px; font-size: 22px; font-weight: 700; letter-spacing: 0.2px; }
      p.desc { margin: 0 0 22px; color: var(--muted); font-size: 14px; }
      a.primary {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: var(--accent);
        color: #fff;
        text-decoration: none;
        font-size: 15px;
        font-weight: 600;
        padding: 12px 20px;
        border-radius: 12px;
        transition: transform 0.15s ease, opacity 0.15s ease;
      }
      a.primary:hover { transform: translateY(-1px); opacity: 0.92; }
      .spinner {
        display: inline-block;
        width: 14px;
        height: 14px;
        border: 2px solid rgba(255, 255, 255, 0.35);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .fallback {
        margin-top: 22px;
        padding-top: 18px;
        border-top: 1px dashed var(--line);
        color: var(--muted);
        font-size: 13px;
      }
      .fallback ul { margin: 8px 0 0; padding-left: 18px; }
      .fallback li { margin: 4px 0; word-break: break-all; }
      .fallback a { color: var(--accent); text-decoration: none; }
      .fallback a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <main>
      <h1>合译 · 工坊</h1>
      <p class="desc">正在前往完整线上站点（可上传文本、练习翻译、管理术语库）…</p>
      <a class="primary" href="https://co-translate.vercel.app">
        <span class="spinner" aria-hidden="true"></span>
        立即进入合译站点 →
      </a>
      <div class="fallback">
        没有自动跳转？可以点以下备用地址：
        <ul>
          <li><a href="https://co-translate.vercel.app">co-translate.vercel.app</a></li>
          <li><a href="https://co-translate-fyv7tld6q-vibecoding-b10c.vercel.app">co-translate-fyv7tld6q-vibecoding-b10c.vercel.app</a>（本次部署地址）</li>
          <li><a href="https://arianotice.github.io/co-translate/public/heyi-flow.html">三维合译流程演示</a></li>
        </ul>
        主地址打不开时可稍等几分钟后重试，或改用「本次部署地址」先体验。
      </div>
    </main>
  </body>
</html>
